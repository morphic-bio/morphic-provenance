[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphic-provenance"
version = "0.1.0"
description = "Standalone provenance event and lineage index for Morphic workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.8,<0.116",
  "pydantic>=2.6,<3",
  "starlette>=0.40,<0.46",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "pytest>=8,<9",
]

[project.scripts]
morphic-provenance = "provenance_service.cli:main"

[tool.setuptools.package-data]
provenance_service = ["schema.sql"]

[tool.setuptools]
packages = ["provenance_service"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
